<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生命体征测量设备端 Demo</title>
  <style>
    :root {
      --bg: #05070b;
      --panel: rgba(255, 255, 255, 0.08);
      --card: #5f6062;
      --line: rgba(255, 255, 255, 0.12);
      --text: #f8fbff;
      --muted: #a9b3c4;
      --blue: #1f6bff;
      --cyan: #15d7ff;
      --orange: #ff9718;
      --green: #16c96b;
      --red: #ff4b55;
      --ring: #1b63d8;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef2f7;
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .demo-wrap {
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    .device {
      position: relative;
      width: 430px;
      height: 860px;
      overflow: hidden;
      border-radius: 34px;
      background:
        radial-gradient(circle at 50% 42%, rgba(18, 79, 153, 0.32), transparent 31%),
        linear-gradient(180deg, #030507 0%, #05070b 100%);
      box-shadow: 0 30px 86px rgba(17, 24, 39, 0.38), inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .device::after {
      content: "";
      position: absolute;
      inset: auto 12px 10px;
      height: 5px;
      border-radius: 999px;
      background: #155dcc;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: 58px 104px 1fr 208px;
      padding: 0 24px 28px;
    }

    .screen--selection {
      grid-template-rows: 58px 134px minmax(0, 1fr) 0;
    }

    .screen--capture {
      grid-template-rows: 58px 144px minmax(0, 1fr) 196px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 58px;
      color: #fff;
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    .status-icons {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      font-size: 17px;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: -8px;
      margin-top: 13px;
      border-radius: 999px;
      background: #39d37c;
      box-shadow: 0 0 0 3px rgba(57,211,124,0.14);
    }

    .header {
      position: relative;
      align-self: start;
      padding-top: 10px;
    }

    .route {
      margin-bottom: 28px;
      color: #6fa6ff;
      font-size: 14px;
    }

    .title {
      margin: 0;
      color: #fff;
      font-size: 38px;
      line-height: 1.08;
      font-weight: 600;
      letter-spacing: 0;
    }

    .voice-hint {
      margin-top: 8px;
      color: #79b2ff;
      font-size: 13px;
      line-height: 1.35;
    }

    .voice-hint[hidden] {
      display: none;
    }

    .interaction {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 420px;
    }

    .screen--selection .interaction {
      align-items: start;
      justify-items: stretch;
      min-height: 0;
      padding-bottom: 0;
    }

    .screen--capture .interaction {
      align-items: center;
      min-height: 0;
      padding-bottom: 8px;
    }

    .screen--capture .voice-hint {
      max-width: 340px;
    }

    .project-list {
      width: 100%;
      display: grid;
      gap: 10px;
      align-self: center;
    }

    .screen--selection .project-list {
      align-self: start;
    }

    .project-card {
      display: block;
      min-height: 88px;
      padding: 14px 16px 15px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .screen--selection .project-card {
      min-height: 78px;
      padding: 12px 16px 13px;
      border-radius: 20px;
    }

    .project-card.active {
      border-color: rgba(43,124,255,0.38);
      background: linear-gradient(180deg, rgba(43,124,255,0.16), rgba(255,255,255,0.045));
      box-shadow: inset 0 0 0 1px rgba(43,124,255,0.12), 0 0 24px rgba(43,124,255,0.1);
    }

    .project-tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      margin-bottom: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      color: #d8e5ff;
      background: rgba(255,255,255,0.08);
      font-size: 12px;
      line-height: 1.2;
    }

    .project-tag.tier {
      border-radius: 6px;
      color: #9eb8e8;
      background: rgba(43,124,255,0.12);
      border: 1px solid rgba(43,124,255,0.22);
      letter-spacing: 0.04em;
    }

    .project-tag.vital {
      color: #c9f8ff;
      background: rgba(21,215,255,0.12);
      border: 1px solid rgba(21,215,255,0.2);
    }

    .project-title {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
    }

    .project-desc {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .human-stage {
      position: relative;
      width: 328px;
      height: 430px;
      display: grid;
      place-items: center;
    }

    .glow {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(31,107,255,0.32), rgba(31,107,255,0.04) 58%, transparent 70%);
      filter: blur(4px);
      transform: translateY(-12px);
    }

    .turntable {
      position: absolute;
      left: 50%;
      bottom: 22px;
      width: 228px;
      height: 70px;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(ellipse at center, #2b2c2e 0 37%, #171819 38% 61%, #3b3c3e 62% 100%);
      box-shadow: inset 0 4px 12px rgba(255,255,255,0.12), 0 18px 28px rgba(0,0,0,0.52);
    }

    .rotating .turntable,
    .resetting .turntable {
      animation: tableTurn 2.3s linear infinite;
    }

    .turntable::after {
      content: "";
      position: absolute;
      inset: 16px 50px;
      border-radius: 50%;
      border-top: 3px solid rgba(21,215,255,0.8);
      border-right: 3px solid transparent;
      transform: rotate(14deg);
    }

    .turntable::before {
      content: "";
      position: absolute;
      inset: 8px 28px;
      border-radius: 50%;
      border: 2px dashed rgba(21,215,255,0.42);
      opacity: 0;
      transform: rotate(18deg);
    }

    .prepare-turn .turntable::before {
      opacity: 1;
      animation: targetAnglePulse 1.8s ease-in-out infinite;
    }

    .prepare-turn .turntable {
      animation: previewTableTurn 3.8s ease-in-out infinite;
    }

    .turn-direction {
      position: absolute;
      left: 50%;
      bottom: 2px;
      width: 294px;
      height: 132px;
      transform: translateX(-50%) rotate(-8deg);
      opacity: 0;
      pointer-events: none;
    }

    .turn-direction::before {
      content: "";
      position: absolute;
      inset: 16px 26px;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: rgba(21,215,255,0.92);
      border-right-color: rgba(21,215,255,0.92);
      filter: drop-shadow(0 0 10px rgba(21,215,255,0.72));
    }

    .turn-direction::after {
      content: "";
      position: absolute;
      right: 42px;
      top: 32px;
      width: 0;
      height: 0;
      border-left: 16px solid rgba(21,215,255,0.96);
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      transform: rotate(33deg);
      filter: drop-shadow(0 0 8px rgba(21,215,255,0.72));
    }

    .turn-direction span {
      position: absolute;
      right: 0;
      top: 54px;
      color: #9eefff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
      text-shadow: 0 0 12px rgba(21,215,255,0.8);
    }

    .rotating .turn-direction {
      opacity: 1;
      animation: turnSweep 2.3s ease-in-out infinite;
    }

    .prepare-turn .turn-direction {
      opacity: 1;
      animation: turnCue 1.7s ease-in-out infinite;
    }

    .person {
      position: absolute;
      left: 50%;
      bottom: 88px;
      width: 142px;
      height: 298px;
      transform: translateX(-50%);
      filter: drop-shadow(0 18px 14px rgba(0,0,0,0.38));
    }

    .prepare-turn .person {
      animation: previewPersonTurn 3.8s ease-in-out infinite;
    }

    .person .head {
      position: absolute;
      left: 48px;
      top: 0;
      width: 46px;
      height: 58px;
      border-radius: 50% 50% 44% 44%;
      background: linear-gradient(145deg, #dce9ff, #9fb3d0);
    }

    .person .body {
      position: absolute;
      left: 36px;
      top: 54px;
      width: 70px;
      height: 112px;
      border-radius: 32px 32px 20px 20px;
      background: linear-gradient(145deg, #dce9ff, #8fa5c3);
    }

    .person .arm,
    .person .leg {
      position: absolute;
      border-radius: 999px;
      background: linear-gradient(145deg, #dce9ff, #8fa5c3);
      transform-origin: top center;
    }

    .person .arm {
      top: 70px;
      width: 20px;
      height: 126px;
    }

    .person .arm.left { left: 22px; transform: rotate(8deg); }
    .person .arm.right { right: 22px; transform: rotate(-8deg); }

    .person .leg {
      top: 158px;
      width: 24px;
      height: 134px;
    }

    .person .leg.left { left: 48px; transform: rotate(4deg); }
    .person .leg.right { right: 48px; transform: rotate(-4deg); }

    .person .foot {
      position: absolute;
      bottom: 0;
      width: 40px;
      height: 14px;
      border-radius: 999px;
      background: #9fb3d0;
    }

    .person .foot.left { left: 37px; }
    .person .foot.right { right: 37px; }

    .camera-node {
      position: absolute;
      right: 0;
      top: 122px;
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #d7f6ff;
      font-size: 18px;
      border: 2px solid rgba(21,215,255,0.65);
      background: radial-gradient(circle, rgba(21,215,255,0.35), rgba(31,107,255,0.12) 58%, rgba(255,255,255,0.04));
      box-shadow: 0 0 28px rgba(21,215,255,0.22);
      opacity: 0;
      transform: translateX(16px) scale(0.86);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .camera-visible .camera-node {
      opacity: 1;
      transform: translateX(0) scale(1);
    }

    .camera-node::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid rgba(21,215,255,0.45);
      opacity: 0;
    }

    .camera-visible .camera-node::before {
      animation: cameraPulse 1.6s ease-out infinite;
    }

    .prepare-turn.camera-visible .camera-node {
      animation: cameraWaitPulse 3.8s ease-in-out infinite;
    }

    .gaze-line {
      position: absolute;
      left: 184px;
      top: 124px;
      width: 86px;
      height: 2px;
      background: linear-gradient(90deg, rgba(21,215,255,0), rgba(21,215,255,0.9));
      opacity: 0;
      transform: rotate(-9deg);
      transform-origin: left center;
    }

    .camera-visible .gaze-line {
      opacity: 1;
      animation: gazePulse 1.2s ease-in-out infinite;
    }

    .prepare-turn.camera-visible .gaze-line {
      animation: gazeCue 3.8s ease-in-out infinite;
    }

    .turn-self .person {
      animation: userTurnRight 3.6s ease-in-out infinite;
    }

    .turn-self .camera-node {
      animation: cameraWaitPulse 2.2s ease-in-out infinite;
    }

    .turn-self .gaze-line {
      animation: gazeCue 3.6s ease-in-out infinite;
    }

    .countdown-number {
      display: grid;
      place-items: center;
      width: 270px;
      height: 270px;
      color: #fff;
      font-size: 152px;
      line-height: 1;
      font-weight: 300;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(25,84,160,0.34), rgba(25,84,160,0.08) 58%, transparent 72%);
      text-shadow: 0 0 30px rgba(85,151,255,0.42);
    }

    .capture-ring {
      --progress: 0deg;
      position: relative;
      display: grid;
      place-items: center;
      width: 256px;
      height: 256px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #071328 0 47%, transparent 48%),
        conic-gradient(var(--cyan) var(--progress), rgba(255,255,255,0.09) 0deg);
      box-shadow: 0 0 46px rgba(31,107,255,0.34);
    }

    .capture-ring::before {
      content: "";
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      border: 22px solid rgba(31,107,255,0.5);
      box-shadow: inset 0 0 26px rgba(21,215,255,0.2);
    }

    .capture-ring::after {
      content: "";
      position: absolute;
      inset: -22px;
      border-radius: 50%;
      background:
        repeating-conic-gradient(from 0deg, rgba(163,193,255,0.52) 0deg 1.8deg, transparent 1.8deg 9deg);
      -webkit-mask: radial-gradient(circle, transparent 62%, #000 63% 65%, transparent 66%);
      mask: radial-gradient(circle, transparent 62%, #000 63% 65%, transparent 66%);
    }

    .capture-center {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .capture-value {
      display: block;
      font-size: 62px;
      font-weight: 650;
      line-height: 1;
    }

    .capture-label {
      display: block;
      margin-top: 10px;
      color: #b8d4ff;
      font-size: 18px;
    }

    .face-capture {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 14px;
      width: 100%;
    }

    .camera-check,
    .camera-capture,
    .processing-stage {
      position: relative;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 18px;
      width: 100%;
      min-height: 340px;
    }

    .camera-core {
      position: relative;
      display: grid;
      place-items: center;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(21,215,255,0.36), rgba(31,107,255,0.24) 34%, rgba(4,12,27,0.94) 68%),
        #061125;
      border: 2px solid rgba(21,215,255,0.52);
      box-shadow: 0 0 46px rgba(21,215,255,0.22), inset 0 0 34px rgba(31,107,255,0.36);
    }

    .camera-core::before {
      content: "";
      position: absolute;
      inset: -22px;
      border-radius: 50%;
      border: 2px solid rgba(21,215,255,0.22);
      animation: cameraPulse 1.8s ease-out infinite;
    }

    .camera-core::after {
      content: "";
      position: absolute;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: radial-gradient(circle, #d9f8ff 0 12%, #15d7ff 13% 32%, #1f6bff 33% 60%, #061125 61% 100%);
      box-shadow: 0 0 26px rgba(21,215,255,0.58);
    }

    .camera-beam {
      position: absolute;
      top: 96px;
      width: 280px;
      height: 18px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(21,215,255,0.72), transparent);
      filter: blur(1px);
      animation: beamSweep 2.2s ease-in-out infinite;
    }

    .check-label {
      position: relative;
      z-index: 2;
      margin-top: 6px;
      padding: 8px 18px;
      border-radius: 999px;
      color: #c9f8ff;
      background: rgba(21,215,255,0.12);
      border: 1px solid rgba(21,215,255,0.32);
      font-size: 18px;
      font-weight: 700;
    }

    .check-dots {
      display: inline-flex;
      gap: 8px;
    }

    .check-dots span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #15d7ff;
      box-shadow: 0 0 14px rgba(21,215,255,0.5);
      animation: dotPulse 1.2s ease-in-out infinite;
    }

    .check-dots span:nth-child(2) { animation-delay: 0.16s; }
    .check-dots span:nth-child(3) { animation-delay: 0.32s; }

    .processing-orbit {
      position: relative;
      display: grid;
      place-items: center;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(31,107,255,0.28), rgba(4,12,27,0.86) 62%, transparent 64%);
      box-shadow: 0 0 52px rgba(31,107,255,0.28);
    }

    .processing-orbit::before {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      border: 8px solid rgba(255,255,255,0.08);
      border-top-color: #15d7ff;
      border-right-color: #15d7ff;
      animation: spin 1.6s linear infinite;
    }

    .processing-orbit span {
      position: relative;
      z-index: 1;
      color: #d8ecff;
      font-size: 28px;
      font-weight: 700;
    }

    .face-frame {
      position: relative;
      width: 220px;
      height: 260px;
      overflow: hidden;
      border-radius: 32px;
      border: 2px solid rgba(21,215,255,0.72);
      background:
        radial-gradient(circle at 50% 39%, rgba(85,166,255,0.28), transparent 28%),
        radial-gradient(circle at 50% 80%, rgba(31,107,255,0.38), transparent 40%),
        rgba(6, 17, 37, 0.86);
      box-shadow: 0 0 44px rgba(21,215,255,0.22), inset 0 0 30px rgba(31,107,255,0.22);
    }

    .face-frame::before {
      content: "";
      position: absolute;
      left: 80px;
      top: 34px;
      width: 60px;
      height: 78px;
      border-radius: 50% 50% 44% 44%;
      background: linear-gradient(180deg, #dce9ff, #91b7ed);
      opacity: 0.92;
    }

    .face-frame::after {
      content: "";
      position: absolute;
      left: 55px;
      top: 116px;
      width: 110px;
      height: 112px;
      border-radius: 58px 58px 24px 24px;
      background: linear-gradient(180deg, #bfd8ff, #6b9ddd);
      opacity: 0.82;
    }

    .face-scan-line {
      position: absolute;
      z-index: 2;
      left: 22px;
      right: 22px;
      top: 36px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #15d7ff, transparent);
      box-shadow: 0 0 18px rgba(21,215,255,0.9);
      animation: scanFace 2.4s ease-in-out infinite;
    }

    .face-corners span {
      position: absolute;
      z-index: 3;
      width: 38px;
      height: 38px;
      border-color: rgba(255,255,255,0.9);
      border-style: solid;
    }

    .face-corners span:nth-child(1) { left: 18px; top: 18px; border-width: 3px 0 0 3px; border-radius: 12px 0 0 0; }
    .face-corners span:nth-child(2) { right: 18px; top: 18px; border-width: 3px 3px 0 0; border-radius: 0 12px 0 0; }
    .face-corners span:nth-child(3) { right: 18px; bottom: 18px; border-width: 0 3px 3px 0; border-radius: 0 0 12px 0; }
    .face-corners span:nth-child(4) { left: 18px; bottom: 18px; border-width: 0 0 3px 3px; border-radius: 0 0 0 12px; }

    .signal-strip {
      display: inline-flex;
      align-items: end;
      gap: 6px;
      height: 34px;
      margin-top: 0;
    }

    .signal-strip span {
      width: 5px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, #15d7ff, #1f6bff);
      box-shadow: 0 0 12px rgba(21,215,255,0.5);
      animation: signalBeat 1.1s ease-in-out infinite;
    }

    .signal-strip span:nth-child(2) { animation-delay: 0.1s; }
    .signal-strip span:nth-child(3) { animation-delay: 0.2s; }
    .signal-strip span:nth-child(4) { animation-delay: 0.3s; }
    .signal-strip span:nth-child(5) { animation-delay: 0.4s; }
    .signal-strip span:nth-child(6) { animation-delay: 0.5s; }

    .capture-progress {
      width: 260px;
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
    }

    .capture-progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #1f6bff, #15d7ff);
      box-shadow: 0 0 18px rgba(21,215,255,0.5);
    }

    .capture-time {
      color: #b8d4ff;
      font-size: 18px;
      line-height: 1.2;
    }

    .capture-time .capture-value {
      display: inline;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }

    .done-mark {
      display: grid;
      place-items: center;
      width: 232px;
      height: 232px;
      border-radius: 50%;
      color: #fff;
      font-size: 78px;
      border: 3px solid rgba(22,201,107,0.78);
      background: radial-gradient(circle, rgba(31,107,255,0.76), rgba(6,23,52,0.62) 55%, rgba(22,201,107,0.08) 70%);
      box-shadow: 0 0 48px rgba(22,201,107,0.24);
    }

    .prompt {
      position: relative;
      align-self: end;
      margin: 0 0 38px;
      padding: 48px 26px 30px 66px;
      min-height: 146px;
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 18px 34px rgba(0,0,0,0.34);
    }

    .screen--capture .prompt {
      margin-bottom: 30px;
      padding: 42px 24px 24px 66px;
      min-height: 132px;
    }

    .screen--capture .prompt-line {
      font-size: 22px;
      line-height: 1.36;
    }

    .screen--capture .prompt-line + .prompt-line {
      margin-top: 8px;
    }

    .screen--capture .prompt-line::before {
      top: 12px;
    }

    .screen--selection .prompt {
      display: none;
    }

    .screen--no-prompt .prompt {
      display: none;
    }

    .screen--continue {
      grid-template-rows: 58px 150px minmax(0, 1fr) 0;
      padding-bottom: 26px;
    }

    .screen--continue .header {
      align-self: end;
      text-align: center;
      padding-top: 0;
    }

    .screen--continue .route,
    .screen--continue .voice-hint {
      display: none;
    }

    .screen--continue .title {
      font-size: 34px;
      line-height: 1.1;
    }

    .screen--continue .interaction {
      min-height: 0;
      align-items: start;
    }

    .continue-stage {
      position: relative;
      width: 100%;
      min-height: 585px;
      padding-top: 126px;
    }

    .continue-person {
      position: absolute;
      top: 10px;
      left: 50%;
      width: 118px;
      height: 150px;
      transform: translateX(-50%);
      opacity: 0.92;
      filter: drop-shadow(0 18px 20px rgba(31,107,255,0.24));
    }

    .continue-person::before {
      content: "";
      position: absolute;
      left: 39px;
      top: 0;
      width: 40px;
      height: 54px;
      border-radius: 50% 50% 44% 44%;
      background: linear-gradient(180deg, #59a6ff, #1f6bff);
    }

    .continue-person::after {
      content: "";
      position: absolute;
      left: 24px;
      top: 52px;
      width: 70px;
      height: 94px;
      border-radius: 34px 34px 18px 18px;
      background: linear-gradient(180deg, #4b98ff, #1957bd 82%, rgba(25,87,189,0));
    }

    .choice-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
    }

    .choice-card {
      min-height: 330px;
      padding: 70px 18px 28px;
      border-radius: 22px;
      text-align: center;
      background: #5f6062;
      box-shadow: 0 18px 36px rgba(0,0,0,0.36);
    }

    .choice-icon {
      display: grid;
      place-items: center;
      width: 96px;
      height: 96px;
      margin: 0 auto 36px;
      border-radius: 22px;
      color: #e7f3ff;
      background: linear-gradient(145deg, #7fc7ff, #2386ff);
      box-shadow: inset 0 5px 10px rgba(255,255,255,0.28), 0 14px 28px rgba(0,0,0,0.24);
      font-size: 42px;
      font-weight: 800;
    }

    .choice-icon.body {
      border-radius: 50%;
      font-size: 52px;
    }

    .choice-title {
      margin: 0;
      color: #fff;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 600;
    }

    .choice-desc {
      margin: 28px 0 0;
      color: rgba(255,255,255,0.68);
      font-size: 17px;
      line-height: 1.55;
    }

    .return-tip {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      color: rgba(255,255,255,0.62);
      text-align: center;
      font-size: 19px;
    }

    .return-tip strong {
      color: var(--orange);
      font-weight: 500;
    }

    .info-badge {
      position: absolute;
      left: 24px;
      top: -18px;
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
    }

    .prompt-line {
      position: relative;
      margin: 0;
      color: #fff;
      font-size: 25px;
      line-height: 1.48;
      font-weight: 500;
      letter-spacing: 0;
    }

    .prompt-line + .prompt-line { margin-top: 12px; }

    .prompt-line[hidden] {
      display: none;
    }

    .prompt-line::before {
      content: "";
      position: absolute;
      left: -30px;
      top: 16px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--orange);
    }

    .caption {
      margin: 0;
      color: #6b7280;
      font-size: 13px;
    }

    .caption strong { color: #334155; }

    .demo-controls {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(148,163,184,0.35);
      box-shadow: 0 16px 36px rgba(15,23,42,0.12);
    }

    .demo-control-btn {
      min-width: 92px;
      height: 38px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: #1f6bff;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    .demo-control-btn.secondary {
      color: #1f2937;
      background: #eef2f7;
    }

    .demo-control-btn:focus-visible {
      outline: 3px solid rgba(31,107,255,0.35);
      outline-offset: 2px;
    }

    .page-indicator {
      min-width: 56px;
      color: #475569;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    @keyframes tableTurn {
      from { transform: translateX(-50%) rotate(0deg); }
      to { transform: translateX(-50%) rotate(360deg); }
    }

    @keyframes previewTableTurn {
      0%, 18% { transform: translateX(-50%) rotate(0deg); }
      44%, 76% { transform: translateX(-50%) rotate(10deg); }
      100% { transform: translateX(-50%) rotate(0deg); }
    }

    @keyframes previewPersonTurn {
      0%, 18% { transform: translateX(-50%) rotate(0deg); }
      44%, 76% { transform: translateX(-50%) rotate(10deg); }
      100% { transform: translateX(-50%) rotate(0deg); }
    }

    @keyframes userTurnRight {
      0%, 18% { transform: translateX(-50%) rotate(0deg); }
      42%, 82% { transform: translateX(-50%) rotate(13deg); }
      100% { transform: translateX(-50%) rotate(0deg); }
    }

    @keyframes targetAnglePulse {
      0%, 100% { opacity: 0.28; transform: rotate(8deg) scale(0.96); }
      50% { opacity: 0.85; transform: rotate(24deg) scale(1.02); }
    }

    @keyframes turnSweep {
      0% { transform: translateX(-50%) rotate(-18deg); opacity: 0.42; }
      50% { transform: translateX(-50%) rotate(8deg); opacity: 1; }
      100% { transform: translateX(-50%) rotate(28deg); opacity: 0.42; }
    }

    @keyframes turnCue {
      0%, 100% { transform: translateX(-50%) rotate(-8deg) scale(0.97); opacity: 0.5; }
      50% { transform: translateX(-50%) rotate(-2deg) scale(1.04); opacity: 1; }
    }

    @keyframes gazePulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    @keyframes gazeCue {
      0%, 38% { opacity: 0; transform: rotate(-9deg) scaleX(0.45); }
      52%, 82% { opacity: 1; transform: rotate(-9deg) scaleX(1); }
      100% { opacity: 0; transform: rotate(-9deg) scaleX(0.45); }
    }

    @keyframes cameraPulse {
      0% { transform: scale(0.84); opacity: 0.62; }
      100% { transform: scale(1.32); opacity: 0; }
    }

    @keyframes cameraWaitPulse {
      0%, 38% { box-shadow: 0 0 18px rgba(21,215,255,0.16); }
      52%, 82% { box-shadow: 0 0 42px rgba(21,215,255,0.62); }
      100% { box-shadow: 0 0 18px rgba(21,215,255,0.16); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes scanFace {
      0%, 100% { transform: translateY(0); opacity: 0.45; }
      50% { transform: translateY(188px); opacity: 1; }
    }

    @keyframes signalBeat {
      0%, 100% { height: 10px; opacity: 0.45; }
      45% { height: 32px; opacity: 1; }
    }

    @keyframes beamSweep {
      0%, 100% { transform: translateY(-62px) scaleX(0.76); opacity: 0.34; }
      50% { transform: translateY(62px) scaleX(1); opacity: 1; }
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.34; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }

    @media (max-width: 560px) {
      body { padding: 10px; align-items: start; }
      .device {
        width: min(100vw - 20px, 430px);
        height: min(100vh - 34px, 860px);
        min-height: 760px;
      }
      .screen { grid-template-rows: 52px 96px 1fr 190px; padding: 0 18px 24px; }
      .screen--selection { grid-template-rows: 52px 118px minmax(0, 1fr) 0; }
      .screen--capture { grid-template-rows: 52px 126px minmax(0, 1fr) 186px; }
      .screen--continue { grid-template-rows: 52px 130px minmax(0, 1fr) 0; }
      .title { font-size: 32px; }
      .screen--continue .title { font-size: 30px; }
      .prompt { padding-left: 58px; }
      .prompt-line { font-size: 21px; }
      .human-stage { transform: scale(0.9); }
      .choice-card { min-height: 290px; padding-top: 52px; }
      .choice-title { font-size: 25px; }
      .choice-desc { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="demo-wrap">
    <section class="device" aria-label="生命体征测量设备端连贯 Demo">
      <div class="screen">
        <div class="status-bar">
          <span>18:32</span>
          <span class="status-icons" aria-hidden="true">WiFi 4G ⚙︎ ▣<span class="status-dot"></span></span>
        </div>
        <header class="header">
          <div class="route" id="routeLabel">测量项目</div>
          <h1 class="title" id="pageTitle">请选择测量项目</h1>
          <div class="voice-hint" id="voiceHint" hidden></div>
        </header>
        <section class="interaction" id="interaction" aria-live="polite"></section>
        <section class="prompt" aria-live="polite">
          <div class="info-badge">i</div>
          <p class="prompt-line" id="promptLineA">站上转台后可开始测量</p>
          <p class="prompt-line" id="promptLineB">系统将自动引导完成生命体征采集</p>
        </section>
      </div>
    </section>
    <p class="caption"><strong>Demo说明：</strong>使用上一页/下一页手动翻页；环境检测按 3 秒展示；采集阶段按 20 秒展示。</p>
    <div class="demo-controls" aria-label="Demo演示控制">
      <button class="demo-control-btn secondary" type="button" id="prevStep">上一页</button>
      <span class="page-indicator" id="pageIndicator">1 / 7</span>
      <button class="demo-control-btn" type="button" id="nextStep">下一页</button>
    </div>
  </main>

  <script>
    const FLOW = [
      {
        key: "select",
        title: "请选择测量项目",
        route: "测量项目",
        type: "selection",
        duration: 3000,
        voice: "请选择生命体征检测项目",
        prompt: ["站上转台后可开始测量", "系统将自动引导完成生命体征采集"]
      },
      {
        key: "stand",
        title: "请站上转台",
        route: "← 生命体征测量",
        type: "human",
        duration: 4200,
        voice: "请站上转台。双手垂放，自然站立，保持静止。",
        prompt: ["请站上转台", "双手垂放，自然站立，保持静止"]
      },
      {
        key: "turn-camera",
        title: "请转向右侧镜头",
        route: "生命体征测量",
        type: "human",
        className: "turn-self camera-visible",
        duration: 6000,
        voice: "请向右转身，正面看向右侧镜头。请勿佩戴眼镜、口罩或帽子，保持脸部无遮挡。",
        prompt: ["请向右转身，正面看向右侧镜头", "请勿佩戴眼镜、口罩或帽子，保持脸部无遮挡"]
      },
      {
        key: "environment",
        title: "正在检测环境",
        route: "生命体征测量",
        type: "environment",
        duration: 3000,
        voice: "正在检测采集环境，请持续看向右侧镜头并保持静止。",
        prompt: ["请持续看向右侧镜头", "保持静止"]
      },
      {
        key: "capturing",
        title: "正在采集生命体征",
        route: "生命体征测量",
        type: "capture",
        duration: 20000,
        voice: "开始采集，请持续看向右侧镜头20秒。滴声提示将持续20秒。",
        prompt: ["请持续看向右侧镜头20秒", "保持静止，避免说话和表情明显浮动"]
      },
      {
        key: "processing",
        title: "正在生成结果",
        route: "生命体征测量",
        type: "processing",
        duration: 4200,
        voice: "正在生成测量结果，请稍候。",
        prompt: ["正在生成生命体征结果", "请稍候，结果将自动保存"]
      },
      {
        key: "continue",
        title: "是否继续测量",
        route: "生命体征测量",
        type: "continue",
        duration: 60000,
        voice: "请选择继续测量或结束测量",
        hidePrompt: true,
        prompt: []
      }
    ];

    const titleEl = document.getElementById("pageTitle");
    const screenEl = document.querySelector(".screen");
    const routeEl = document.getElementById("routeLabel");
    const voiceHintEl = document.getElementById("voiceHint");
    const interactionEl = document.getElementById("interaction");
    const promptAEl = document.getElementById("promptLineA");
    const promptBEl = document.getElementById("promptLineB");
    const pageIndicatorEl = document.getElementById("pageIndicator");
    const prevStepEl = document.getElementById("prevStep");
    const nextStepEl = document.getElementById("nextStep");

    let currentIndex = 0;
    let stepStartedAt = performance.now();
    let frameId = 0;
    let beepTimer = 0;
    let audioContext = null;

    function render() {
      const step = FLOW[currentIndex];
      stopVoiceCues();
      stepStartedAt = performance.now();
      const screenClasses = ["screen"];
      if (step.type === "selection") screenClasses.push("screen--selection");
      if (step.type === "capture") screenClasses.push("screen--capture");
      if (step.type === "continue") screenClasses.push("screen--continue");
      if (step.hidePrompt) screenClasses.push("screen--no-prompt");
      screenEl.className = screenClasses.join(" ");
      titleEl.textContent = step.title;
      routeEl.textContent = step.route;
      voiceHintEl.textContent = step.voice ? `语音提示：${step.voice}` : "";
      voiceHintEl.hidden = !step.voice;
      promptAEl.textContent = step.prompt[0] || "";
      promptBEl.textContent = step.prompt[1] || "";
      promptAEl.hidden = !step.prompt[0];
      promptBEl.hidden = !step.prompt[1];
      pageIndicatorEl.textContent = `${currentIndex + 1} / ${FLOW.length}`;
      interactionEl.className = "interaction";

      if (step.className) {
        step.className.split(/\s+/).filter(Boolean).forEach((name) => {
          interactionEl.classList.add(name);
        });
      }

      if (step.type === "selection") {
        interactionEl.innerHTML = `
          <div class="project-list">
            <div class="project-card">
              <div class="project-tag">推荐</div>
              <p class="project-title">综合测量</p>
              <p class="project-desc">综合测量：体重、体成分、围度、身高、体态一次出结果。</p>
            </div>
            <div class="project-card">
              <div class="project-tag tier">专业测量</div>
              <p class="project-title">体态测量</p>
              <p class="project-desc">IPose：双手自然垂放，减少上肢代偿与遮挡，体态结果更准。</p>
            </div>
            <div class="project-card">
              <p class="project-title">单项测量</p>
              <p class="project-desc">按项目单独测量；肩部与红外热态可走完整流程。</p>
            </div>
            <div class="project-card active">
              <div class="project-tag vital">新增</div>
              <p class="project-title">生命体征测量</p>
              <p class="project-desc">非接触采集心率、呼吸率等指标。</p>
            </div>
          </div>
        `;
      }

      if (step.type === "human") {
        interactionEl.innerHTML = humanTemplate(step.key === "camera");
      }

      if (step.type === "countdown") {
        interactionEl.innerHTML = `<div class="countdown-number">${step.number}</div>`;
      }

      if (step.type === "capture") {
        interactionEl.innerHTML = captureTemplate();
        updateCapture();
      }

      if (step.type === "environment") {
        interactionEl.innerHTML = environmentTemplate();
      }

      if (step.type === "done") {
        interactionEl.innerHTML = `<div class="done-mark">✓</div>`;
      }

      if (step.type === "success") {
        interactionEl.innerHTML = `<div class="done-mark">✓</div>`;
      }

      if (step.type === "processing") {
        interactionEl.innerHTML = processingTemplate();
      }

      if (step.type === "continue") {
        interactionEl.innerHTML = continueTemplate();
      }

      cancelAnimationFrame(frameId);
      if (step.type === "capture") frameId = requestAnimationFrame(updateCapture);
      playVoiceCue(step);
    }

    function nextStep() {
      currentIndex = (currentIndex + 1) % FLOW.length;
      render();
    }

    function previousStep() {
      currentIndex = (currentIndex - 1 + FLOW.length) % FLOW.length;
      render();
    }

    function updateCapture() {
      const step = FLOW[currentIndex];
      if (!step || step.type !== "capture") return;
      const elapsed = performance.now() - stepStartedAt;
      const progress = Math.min(1, elapsed / step.duration);
      const remain = Math.max(0, Math.ceil((step.duration - elapsed) / 1000));
      const ring = interactionEl.querySelector(".capture-ring");
      const bar = interactionEl.querySelector(".capture-progress-bar");
      const value = interactionEl.querySelector(".capture-value");
      if (ring) ring.style.setProperty("--progress", `${Math.round(progress * 360)}deg`);
      if (bar) bar.style.width = `${Math.round(progress * 100)}%`;
      if (value) value.textContent = remain;
      if (progress >= 1) return;
      frameId = requestAnimationFrame(updateCapture);
    }

    function stopVoiceCues() {
      if (beepTimer) {
        clearInterval(beepTimer);
        beepTimer = 0;
      }
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    }

    function playVoiceCue(step) {
      if (step.voice && "speechSynthesis" in window) {
        const utterance = new SpeechSynthesisUtterance(step.voice);
        utterance.lang = "zh-CN";
        utterance.rate = 0.95;
        utterance.pitch = 1;
        window.speechSynthesis.speak(utterance);
      }
      if (step.type === "capture") {
        startBeepCue(step.duration);
      }
    }

    function startBeepCue(duration) {
      const startedAt = performance.now();
      const tick = () => {
        if (performance.now() - startedAt > duration) {
          clearInterval(beepTimer);
          beepTimer = 0;
          return;
        }
        playBeep();
      };
      tick();
      beepTimer = window.setInterval(tick, 1000);
    }

    function playBeep() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      if (!audioContext) audioContext = new AudioContextClass();
      if (audioContext.state === "suspended") {
        audioContext.resume().catch(() => {});
      }
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const now = audioContext.currentTime;
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.16, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.18);
    }

    function humanTemplate() {
      return `
        <div class="human-stage">
          <div class="glow"></div>
          <div class="turntable"></div>
          <div class="person" aria-hidden="true">
            <div class="head"></div>
            <div class="body"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
            <div class="foot left"></div>
            <div class="foot right"></div>
          </div>
          <div class="gaze-line"></div>
          <div class="camera-node">镜头</div>
        </div>
      `;
    }

    function captureTemplate() {
      return `
        <div class="camera-capture">
          <div class="camera-core" aria-label="右侧镜头采集中">
            <div class="camera-beam"></div>
          </div>
          <div class="signal-strip" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="capture-progress"><div class="capture-progress-bar"></div></div>
          <div class="capture-time">剩余 <span class="capture-value">20</span> 秒</div>
        </div>
      `;
    }

    function environmentTemplate() {
      return `
        <div class="camera-check">
          <div class="camera-core" aria-label="采集环境检测中">
            <div class="camera-beam"></div>
          </div>
          <div class="check-label">检测环境中</div>
          <div class="check-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
      `;
    }

    function processingTemplate() {
      return `
        <div class="processing-stage">
          <div class="processing-orbit"><span>生成中</span></div>
        </div>
      `;
    }

    function continueTemplate() {
      return `
        <div class="continue-stage">
          <div class="continue-person"></div>
          <div class="choice-grid">
            <div class="choice-card">
              <div class="choice-icon body">体</div>
              <p class="choice-title">身体成分</p>
              <p class="choice-desc">了解您的体重、体脂率、肌肉量、身体围度等</p>
            </div>
            <div class="choice-card">
              <div class="choice-icon">END</div>
              <p class="choice-title">结束测量</p>
              <p class="choice-desc">结束后可查看视觉健康状态报告</p>
            </div>
          </div>
          <div class="return-tip"><strong>60</strong> 秒后返回首页</div>
        </div>
      `;
    }

    prevStepEl.addEventListener("click", previousStep);
    nextStepEl.addEventListener("click", nextStep);

    render();
  </script>
</body>
</html>
